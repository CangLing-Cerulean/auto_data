[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "online-ts-research"
version = "0.1.0"
description = "Auditable time-series research workflows and rolling forecast operations"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
neural = ["torch>=2.2"]

[project.scripts]
ts-platform = "online_ts.platform.__main__:main"

[tool.setuptools.packages.find]
include = ["online_ts*"]

[tool.setuptools.package-data]
online_ts = ["prompts/*.txt", "prompts/*.json"]
